# MySQL listo para desarrollo:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: mostrador
      MYSQL_USER: mostrador
      MYSQL_PASSWORD: mostrador_pass
    ports:
      - "3306:3306"
    volumes:
      - mostrador_data:/var/lib/mysql
volumes:
  mostrador_data:
